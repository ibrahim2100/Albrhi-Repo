name: Build Albrhi NextUp (manual)

#
# **Manual only. Nothing here publishes anything.**
#
# Albrhi NextUp injects into SpringBoard, and nothing in this port has been run on a
# device yet. The same withholding CarPlay is under, for a sharper reason: a wrong hook
# in an ordinary app kills that app, and a wrong hook in SpringBoard takes the home
# screen down with it. Offering the package before a real device has confirmed it would
# be offering a respring loop.
#
# Standing this up as a real publisher later means what CLAUDE.md describes for any
# second publisher: its own tag namespace (nextup-v*), a release step, the shared APT
# gather, and the albrhi-pages concurrency group. buildlocket.yml's history is the shape
# to copy.
#
# Until then this exists to answer one question quickly: does it compile.
#

on:
    workflow_dispatch:

env:
    TWEAK_DIR: main/tweaks/nextup

jobs:
    build:
        name: Build NextUp rootless + roothide
        runs-on: macos-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Source checks
              run: |
                cd main
                python3 tools/check.py

            - name: Read the version
              run: |
                V=$(awk -F': *' '/^Version:/ {print $2; exit}' "$TWEAK_DIR/control")
                echo "NU_VERSION=$V" >> "$GITHUB_ENV"
                echo "Building Albrhi NextUp $V"

            - name: Install build dependencies
              run: brew install ldid make dpkg

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build for rootless
              run: |
                cd main
                chmod +x build.sh
                ./build.sh nextup rootless
                ls -la tweaks/nextup/packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Setup roothide Theos
              uses: actions/checkout@v4
              with:
                repository: roothide/theos
                ref: master
                path: ${{ github.workspace }}/theos-roothide
                submodules: recursive

            - name: Share the SDK with roothide Theos
              run: |
                mkdir -p "${{ github.workspace }}/theos-roothide/sdks"
                cp -R "${{ github.workspace }}/theos/sdks/." "${{ github.workspace }}/theos-roothide/sdks/"
                ls "${{ github.workspace }}/theos-roothide/sdks"

            - name: Build for roothide
              run: |
                cd main
                ./build.sh nextup roothide
                ls -la tweaks/nextup/packages
              env:
                THEOS: ${{ github.workspace }}/theos-roothide

            - name: Upload both debs
              uses: actions/upload-artifact@v4
              with:
                name: AlbrhiNextUp-${{ env.NU_VERSION }}
                path: main/tweaks/nextup/packages/*.deb
                if-no-files-found: error
