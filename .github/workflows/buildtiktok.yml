name: Build Albrhi for TikTok (manual)

#
# **Manual only. Nothing here publishes anything.**
#
# TikTok is not in suite/control and has no release workflow of its own yet, the same
# way CarPlay was withheld: it has not been run on a real device, and offering a
# package to install would be offering an update to nobody who has actually confirmed
# it works. See CLAUDE.md for what standing this up for real -- its own tag namespace,
# a release step, the shared APT gather -- would take, modelled on buildlocket.yml.
#
# Until then this exists for the same reason buildpanel.yml and its siblings do:
# building one tweak on its own is the fastest way to find out whether it compiles.
#

on:
    workflow_dispatch:

env:
    TWEAK_DIR: main/tweaks/tiktok

jobs:
    build:
        name: Build TikTok rootless + roothide
        runs-on: macos-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Source checks
              run: |
                cd main
                python3 tools/check.py

            - name: Read the version
              run: |
                V=$(awk -F': *' '/^Version:/ {print $2; exit}' "$TWEAK_DIR/control")
                echo "TT_VERSION=$V" >> "$GITHUB_ENV"
                echo "Building Albrhi for TikTok $V"

            - name: Install build dependencies
              run: brew install ldid make dpkg

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build for rootless
              run: |
                cd main
                chmod +x build.sh
                ./build.sh tiktok rootless
                ls -la tweaks/tiktok/packages
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Setup roothide Theos
              uses: actions/checkout@v4
              with:
                repository: roothide/theos
                ref: master
                path: ${{ github.workspace }}/theos-roothide
                submodules: recursive

            - name: Share the SDK with roothide Theos
              run: |
                mkdir -p "${{ github.workspace }}/theos-roothide/sdks"
                cp -R "${{ github.workspace }}/theos/sdks/." "${{ github.workspace }}/theos-roothide/sdks/"
                ls "${{ github.workspace }}/theos-roothide/sdks"

            - name: Build for roothide
              run: |
                cd main
                ./build.sh tiktok roothide
                ls -la tweaks/tiktok/packages
              env:
                THEOS: ${{ github.workspace }}/theos-roothide

            - name: Upload both debs
              uses: actions/upload-artifact@v4
              with:
                name: AlbrhiTikTok-${{ env.TT_VERSION }}
                path: main/tweaks/tiktok/packages/*.deb
                if-no-files-found: error
