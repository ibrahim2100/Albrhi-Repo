name: Build Albrhi (all tweaks, one package)

#
# Builds every tweak and puts them in one .deb, uploaded as an artifact.
#
# **This is the only workflow that publishes.** The combined package has been installed
# on a device, removed the three it replaces, and worked -- so it now owns the release,
# the APT index and the Pages deploy, and the three older workflows have been reduced to
# manual builds that write nothing.
#
# One publisher rather than three is the point. make-repo.sh wipes debs/ and rebuilds it
# from what is published, so two workflows deploying gh-pages have to be sequenced by a
# concurrency group and a gather that checks what it found -- an arrangement that has
# already served an index a version behind a release once. With a single publisher the
# race cannot happen at all.
#
# The albrhi-pages group is kept anyway. The old workflows can still be run by hand, and
# a manual run must not be able to write the branch at the same time as this one.
#

on:
    push:
        branches:
            - 'main'
        paths:
            # Anything that changes what ends up in the package, which is now every
            # tweak this workflow actually bundles -- Instagram, YouTube, X and the
            # panel. CarPlay is excluded on purpose: it is not in the package
            # (.no-suite marks it), so a commit that only touches it has nothing for
            # this workflow to do, and running it anyway is exactly the confusion a
            # report named directly -- a standalone tweak's push rebuilding Instagram,
            # YouTube, X, TikTok and the panel for no reason, on every single commit.
            # Keep this list in step with tools/make-suite.sh's own skip list; another
            # standalone tweak needs its own '!' line here too. Locket's line was
            # removed with the tweak itself.
            - 'suite/**'
            - 'tweaks/**'
            - '!tweaks/carplay/**'
            - 'shared/**'
            - 'tools/**'
            - 'extra-debs/**'
            - '.github/workflows/buildsuite.yml'
    workflow_dispatch:
        inputs:
            force_rebuild:
                description: 'Release even if this version was already released'
                type: boolean
                default: false

jobs:
    build:
        name: Build, release and publish
        runs-on: macos-latest

        # Shared with the older workflows, and never cancelled. They can still be run
        # by hand, and two runs must not rebuild and deploy gh-pages at once --
        # cancelling rather than queueing would drop an index update.
        concurrency:
            group: albrhi-pages
            cancel-in-progress: false

        permissions:
            contents: write
            # pages: write is what lets the run point Pages at the branch and ask
            # for a build. id-token went with deploy-pages, which is gone.
            pages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Source checks
              run: |
                cd main
                python3 tools/check.py

            - name: Read the version
              run: |
                V=$(awk -F': *' '/^Version:/ {print $2; exit}' main/suite/control)
                echo "SUITE_VERSION=$V" >> $GITHUB_ENV
                echo "Building Albrhi $V"

            - name: Decide whether a release is needed
              id: gate
              # Asked of the remote rather than of a file: the tag is the only record
              # of what has actually been published, and a version number in a control
              # file says only what somebody intended.
              run: |
                cd main
                if git ls-remote --exit-code --tags origin "refs/tags/v${SUITE_VERSION}" > /dev/null 2>&1; then
                  if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
                    echo "v${SUITE_VERSION} exists; forced"
                    echo "release=true" >> $GITHUB_OUTPUT
                  else
                    echo "v${SUITE_VERSION} is already released — building, not releasing"
                    echo "release=false" >> $GITHUB_OUTPUT
                  fi
                else
                  echo "v${SUITE_VERSION} is new"
                  echo "release=true" >> $GITHUB_OUTPUT
                fi

            - name: Install build dependencies
              run: brew install ldid make dpkg

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build everything, rootless
              run: |
                cd main
                chmod +x tools/make-suite.sh build.sh
                ./tools/make-suite.sh rootless
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Check the package holds every tweak
              # A merged tree that quietly lost a dylib installs perfectly and does
              # nothing, which is the failure this whole change could produce and the
              # one nobody would notice until a feature was missing.
              #
              # This list was written for three tweaks and stayed at three while two
              # more (X, Locket) were added and merged without it -- a silent gap of
              # exactly the kind this check exists to catch, just in the check itself.
              # It now includes every tweak under tweaks/, so the next one added here
              # is the only place this needs to change again.
              run: |
                cd main
                DEB=$(ls -t packages/*.deb | head -n1)
                echo "Inspecting $DEB"
                dpkg-deb -c "$DEB" > /tmp/contents.txt
                cat /tmp/contents.txt

                for EXPECTED in \
                    DynamicLibraries/Albrhi.dylib \
                    DynamicLibraries/Albrhi.plist \
                    DynamicLibraries/AlbrhiYT.dylib \
                    DynamicLibraries/AlbrhiYT.plist \
                    DynamicLibraries/AlbrhiTW.dylib \
                    DynamicLibraries/AlbrhiTW.plist \
                    DynamicLibraries/AlbrhiTT.dylib \
                    DynamicLibraries/AlbrhiTT.plist \
                    PreferenceBundles/AlbrhiPanel.bundle/AlbrhiPanel \
                    PreferenceLoader/Preferences/AlbrhiPanel.plist
                do
                    if ! grep -q "$EXPECTED" /tmp/contents.txt; then
                        echo "::error::$EXPECTED is missing from the package"
                        exit 1
                    fi
                    echo "ok  $EXPECTED"
                done

            - name: Setup roothide Theos
              uses: actions/checkout@v4
              with:
                repository: roothide/theos
                ref: master
                path: ${{ github.workspace }}/theos-roothide
                submodules: recursive

            - name: Share the SDK with roothide Theos
              # The same iPhoneOS16.2 SDK: the panel's Makefile pins it by name and the
              # roothide fork keeps its own sdks directory. Copied rather than fetched twice.
              run: |
                mkdir -p "${{ github.workspace }}/theos-roothide/sdks"
                cp -R "${{ github.workspace }}/theos/sdks/." "${{ github.workspace }}/theos-roothide/sdks/"
                ls "${{ github.workspace }}/theos-roothide/sdks"

            - name: Build everything, roothide
              run: |
                cd main
                ./tools/make-suite.sh roothide
              env:
                THEOS: ${{ github.workspace }}/theos-roothide

            - name: Check both flavours were produced
              # 1.0.0 shipped rootless only, because this step did not exist and nobody was
              # counting. Two packages are expected; anything else is a failure, not a
              # detail to notice later.
              run: |
                cd main
                ls -la packages/
                COUNT=$(ls packages/*.deb 2>/dev/null | wc -l | tr -d ' ')
                if [ "$COUNT" != "2" ]; then
                  echo "::error::expected a rootless and a roothide .deb, found $COUNT"
                  exit 1
                fi
                echo "ok  two packages"

                # And what actually distinguishes them, printed rather than assumed.
                #
                # 1.0.2 produced a roothide package that installed as a rootless one, and
                # the cause could be the control or it could be the paths. Guessing between
                # the two has cost this project a release each time; this shows both.
                for DEB in packages/*.deb; do
                  echo ""
                  echo "================================================================"
                  echo "$DEB"
                  echo "================================================================"
                  dpkg-deb -f "$DEB"
                  echo "--- paths"
                  dpkg-deb -c "$DEB" | awk '{print $NF}' | sort
                done

            - name: Upload both debs
              uses: actions/upload-artifact@v4
              with:
                name: Albrhi-${{ env.SUITE_VERSION }}
                path: main/packages/*.deb
                if-no-files-found: error

            - name: Extract changelog for this version
              if: steps.gate.outputs.release == 'true'
              run: |
                cd main
                python3 tools/release-notes.py suite/CHANGELOG.md suite/control > /tmp/notes.md
                echo '--- release notes'
                cat /tmp/notes.md

            - name: Publish release
              if: steps.gate.outputs.release == 'true'
              uses: softprops/action-gh-release@v2
              with:
                name: Albrhi ${{ env.SUITE_VERSION }}
                tag_name: v${{ env.SUITE_VERSION }}
                body_path: /tmp/notes.md
                files: main/packages/*.deb
                fail_on_unmatched_files: true

            - name: Prepare added packages
              if: github.ref == 'refs/heads/main'
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                cd main

                # A control archive compressed with xz is unreadable in the browser
                # tool, which has no LZMA decoder. Converting the container here --
                # payload untouched -- means a package uploaded from a phone can be
                # edited from a phone afterwards.
                changed=0

                for deb in extra-debs/*.deb; do
                  [ -e "$deb" ] || continue

                  if python3 tools/deb-edit.py normalize "$deb" | grep -q '^Converted'; then
                    echo "Normalised $deb"
                    changed=1
                  fi

                  # Several flavours of one tweak otherwise appear in Sileo under
                  # identical names, and the wrong one gets installed. The label is
                  # read from the architecture, so it is a fact, not a guess.
                  if python3 tools/deb-edit.py label "$deb" | grep -q '^Labelled'; then
                    echo "Labelled $deb"
                    changed=1
                  fi
                done

                if [ "$changed" -eq 0 ]; then
                  echo "Nothing to prepare."
                  exit 0
                fi

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add extra-debs

                # [skip ci] matters: this commit lands on main, and without it the
                # workflow would trigger itself again.
                git commit -q -m "Prepare added packages: normalise and label [skip ci]"
                git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

            - name: Gather every published package
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                # The index is built from what is published, not from what this run
                # compiled. That is what lets a second workflow in this repository
                # rebuild the index without erasing this tweak from the source --
                # make-repo.sh wipes debs/ on purpose, and an index built from one
                # tweak's build output would take the other tweak down with it.
                #
                # It also keeps earlier versions installable: a build that turns out
                # to be broken on a device has to be rollable back from Sileo rather
                # than by hunting for an asset on the releases page.
                #
                # The fourth argument folds in this run's own build, under the same
                # naming as everything else. The releases listing is eventually
                # consistent, so a release published seconds ago may not appear in
                # it -- YouTube shipped an index missing its own release exactly
                # that way, and this side had the same gap without having hit it.
                chmod +x main/tools/fetch-published-debs.sh
                # main/packages is where make-suite.sh leaves both flavours, and
                # "albrhi" is the name fetch_by_tag uses to ask for this run's own
                # release if the listing has not caught up with it yet.
                ./main/tools/fetch-published-debs.sh published "${{ github.repository }}" 3 "main/packages" albrhi

            - name: Publish APT repo to GitHub Pages
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                set -x
                REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
                REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

                rm -rf pages
                mkdir pages
                cd pages
                git init -q
                git remote add origin "$REMOTE"

                # Ask whether the branch exists rather than inferring it from a failed
                # clone: a failed clone can leave a partial directory behind, which is
                # what broke the first attempt at this step.
                if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                  echo "gh-pages exists — fetching it."
                  git fetch -q --depth 1 origin gh-pages
                  git checkout -q -b gh-pages FETCH_HEAD
                else
                  echo "gh-pages does not exist — starting a fresh branch."
                  git checkout -q -b gh-pages
                fi

                cd ..

                chmod +x main/tools/make-repo.sh
                ./main/tools/make-repo.sh published pages "$REPO_URL"

                cp main/tools/repo-index.html pages/index.html

                # The deb editor, usable from any device including a phone.
                mkdir -p pages/deb-edit
                cp main/tools/deb-edit.html pages/deb-edit/index.html

                # Puts the tweak inside an Instagram IPA, entirely in the visitor's
                # browser. Nothing is uploaded, so hosting the page carries none of
                # the risk that hosting an IPA would.
                mkdir -p pages/inject
                cp main/tools/ipa-inject.html pages/inject/index.html

                # Regenerated every run so the version and changelog shown on the
                # package page always match what was actually built. The generator
                # reads CHANGELOG.md relative to its own working directory, hence
                # the cd; the output path is absolute so the cd cannot redirect it.
                # From suite/, because the generator reads CHANGELOG.md relative to its
                # working directory and the combined package's is the one this page
                # describes. $TWEAK_DIR was an Instagram-only variable that came with
                # these steps and does not exist here; it expanded to nothing, `cd ''`
                # left the run in the workspace root, and the generator was looked for
                # two directories above it.
                PAGES_DIR="$(pwd)/pages"
                ( cd main/suite && python3 ../tools/make-depiction.py "$PAGES_DIR" "$SUITE_VERSION" "$REPO_URL" albrhi )

                ls -la pages/depictions

                # Source icon, shown beside the repo name in Sileo and Zebra.
                # Regenerated each run; drop tools/logo.png in to override it.
                python3 main/tools/make-logo.py pages/CydiaIcon.png 512

                # GitHub Pages skips files and folders beginning with an underscore
                # unless this marker is present. Harmless here, and prevents a class
                # of silent 404s.
                touch pages/.nojekyll

                cd pages
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A

                if git diff --cached --quiet; then
                  echo "Repo index unchanged — nothing to push."
                  exit 0
                fi

                git commit -q -m "Repo: Albrhi ${SUITE_VERSION}"
                git push -q origin gh-pages

                echo "Index committed to gh-pages; the deploy steps below publish it."

            # The branch above stays the source of truth and stays readable. These
            # steps only make the publish explicit: it succeeds or fails inside this
            # run, with a log, instead of depending on a trigger that can stop
            # firing without notice — which is exactly what happened.
            - name: Serve the source from the branch
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
              env:
                GH_TOKEN: ${{ github.token }}
              # deploy-pages is gone, and this is why.
              #
              # It queued indefinitely on every run. Not slowly -- indefinitely: the
              # action created a deployment, polled it, and the status never left
              # deployment_queued. It happened with the repository in workflow mode,
              # which is the mode that action is for, so it was not the wrong mechanism
              # being used in the wrong place. It simply did not complete, run after
              # run, and no log on this side said why.
              #
              # An APT source does not need it. The gh-pages branch is pushed above and
              # already holds the finished index; serving that branch directly is the
              # older, plainer arrangement and it has no queue to sit in.
              #
              # So the mode is set here rather than in a settings page, because a
              # publishing pipeline that depends on someone remembering a checkbox is
              # one that breaks silently the next time the repository is recreated. The
              # call is idempotent -- it states the arrangement rather than toggling it.
              run: |
                # Attempted, not relied on. GITHUB_TOKEN may deploy to Pages and may
                # not reconfigure it -- the PUT below is refused on this repository, and
                # the POST after it is refused too whenever Pages is in workflow mode,
                # where branch builds do not exist. Both are left in because they cost
                # nothing and succeed on a repository whose token does have the rights;
                # the step after this one is what reports whether the source is right.
                echo "Pointing Pages at the gh-pages branch"
                gh api -X PUT "repos/${{ github.repository }}"                     --field has_pages=true --silent 2>/dev/null || true

                if gh api -X PUT "repos/${{ github.repository }}/pages"                     --field 'build_type=legacy'                     --field 'source[branch]=gh-pages'                     --field 'source[path]=/' --silent 2>/dev/null; then
                  echo "Pages now serves gh-pages"
                else
                  # Already in this arrangement, or the token cannot change it. Neither
                  # is a failure: the build request below is what actually refreshes the
                  # site, and the step after that checks whether it worked.
                  echo "::warning::could not set the Pages source; continuing"
                fi

                # And the build that serves what was just pushed. GitHub normally starts
                # one on push, and CLAUDE.md records that it stopped doing so for pushes
                # made with GITHUB_TOKEN -- the branch updated while the site kept
                # serving the previous release. Asking explicitly removes the dependency
                # on that trigger, which is the whole reason a deploy step existed.
                gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent                   && echo "build requested"                   || echo "::warning::could not request a build; the push may still start one"

            - name: Check the source actually serves this version
              # The outcome, not the mechanism.
              #
              # The index is published two ways -- the gh-pages branch is pushed above
              # and the same tree is deployed as a Pages artifact -- and which of them
              # the site is served from is a repository setting, not something this
              # file can see. So neither is trusted: this asks the live URL whether it
              # is serving the version that was just built.
              #
              # `always()` so it still runs when the deploy step failed or timed out.
              # That is exactly when the answer matters: if the branch is what serves
              # the site, the source is fine and the deploy was redundant, and this is
              # the step that can say so.
              if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/Packages"
                echo "Asking $BASE for com.albrhi ${SUITE_VERSION}"

                # Pages can take a little while to serve a fresh deploy, so this waits
                # rather than deciding on the first answer.
                # Six tries at twenty seconds, and no more.
                #
                # Waiting longer was the mistake, three times: five minutes on a build
                # status, then ten, then ten here. What this step exists to catch is Pages
                # not being served from the branch at all -- which is a setting, is
                # actionable, and is answered by the first response. Whether the site has
                # caught up to *this* version is latency, it is not a fault, and no amount
                # of waiting turns it into information anyone can act on.
                #
                # A build that has not landed yet is the normal case. A source serving no
                # com.albrhi at all is the fault. Two minutes tells those apart.
                for ATTEMPT in $(seq 1 6); do
                  # A fresh query string each time: the Pages CDN can hand back the
                  # copy it already had for a little while after a build finishes.
                  BODY=$(curl -fsSL "${BASE}?t=$(date +%s)-${ATTEMPT}" 2>/dev/null || true)

                  if printf '%s' "$BODY" | grep -A5 '^Package: com.albrhi$' | grep -q "^Version: ${SUITE_VERSION}$"; then
                    echo "ok  the source is serving ${SUITE_VERSION}"
                    exit 0
                  fi

                  # The *newest* com.albrhi in the index, not the first one in it.
                  #
                  # The index deliberately keeps the last three releases, and
                  # dpkg-scanpackages emits them in filename order -- oldest first. So
                  # `head -n1` was printing the oldest version the site holds and calling
                  # it what the site is serving. A run that was two releases behind
                  # reported "Version: 1.3.0" and read as five months of nothing working,
                  # which is where the next hour went. sort -V, and the last line.
                  SERVING=$(printf '%s' "$BODY" | grep -A5 '^Package: com.albrhi$'                       | grep '^Version:' | sort -V | tail -n1)
                  echo "attempt ${ATTEMPT}: ${SERVING:-nothing for com.albrhi yet}"
                  sleep 20
                done

                # Not this version yet. Which of the two things that means is the whole
                # question, and the answer is whether it is serving Albrhi at all.
                echo "Serving: ${SERVING:-nothing for com.albrhi}"
                echo ""

                # An older Albrhi is the branch being served, with this push's build not
                # landed yet. The release is out, the index on the branch is right, and the
                # site catches up when Pages gets to it. Failing here marks a release that
                # worked -- and it has, twice.
                #
                # Sileo will show the older number until then, while Settings > Albrhi shows
                # what is actually installed. Those two disagreeing is the two of them
                # answering different questions correctly, not a fault.
                if [ -n "$SERVING" ]; then
                  echo "::notice::the source is serving ${SERVING#Version: }; ${SUITE_VERSION} follows when Pages builds"
                  echo "The release is published and the branch holds the right index."
                  echo "Nothing here needs doing."
                  exit 0
                fi

                echo "::error::the source is serving no com.albrhi at all"
                echo ""
                echo "The release is published and gh-pages holds the finished index, so"
                echo "the branch is right and the site is not being built from it."
                echo ""
                echo "Check the one setting this side cannot read:"
                echo ""
                echo "  Settings -> Pages -> Build and deployment -> Source"
                echo "      Deploy from a branch"
                echo "      Branch: gh-pages    Folder: / (root)"
                echo ""
                echo "If it says GitHub Actions instead, branch pushes are never served"
                echo "and the site stays frozen at the last branch build -- which looks"
                echo "exactly like this."
                exit 1
