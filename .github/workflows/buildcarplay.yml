name: Build Albrhi CarPlay

#
# CarPlay is not in com.albrhi. It patches SpringBoard and Camera for a car-display
# feature that has nothing to do with the social apps the suite bundles, so it
# publishes on its own instead of riding along in buildsuite.yml -- installing Albrhi
# should not mean installing something for a car nobody asked about.
#
# That makes this the second workflow that actually publishes, after buildsuite.yml.
# The other four per-tweak workflows (buildtweak, buildyoutube, buildtwitter,
# buildlocket) and buildpanel.yml stay manual-build-only, because everything they
# build already ships through the suite -- see CLAUDE.md's CI section.
#
# Two publishers means the shared APT index has to survive both writing it. The same
# discipline buildsuite.yml uses applies here: build the index from what is published
# rather than from this run's own output, fold this run's own build in by name so a
# release the listing has not caught up with yet is not lost, and take the shared
# albrhi-pages concurrency group so the two never write gh-pages at once.
#

on:
    push:
        branches:
            - 'main'
        paths:
            - 'tweaks/carplay/**'
            - 'shared/**'
            - 'tools/**'
            - '.github/workflows/buildcarplay.yml'
    workflow_dispatch:
        inputs:
            force_rebuild:
                description: 'Release even if this version was already released'
                type: boolean
                default: false

jobs:
    build:
        name: Build, release and publish
        runs-on: macos-latest

        concurrency:
            group: albrhi-pages
            cancel-in-progress: false

        permissions:
            contents: write
            pages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Source checks
              run: |
                cd main
                python3 tools/check.py

            - name: Read the version
              run: |
                V=$(awk -F': *' '/^Version:/ {print $2; exit}' main/tweaks/carplay/control)
                echo "CP_VERSION=$V" >> $GITHUB_ENV
                echo "Building Albrhi CarPlay $V"

            - name: Decide whether a release is needed
              id: gate
              run: |
                cd main
                if git ls-remote --exit-code --tags origin "refs/tags/carplay-v${CP_VERSION}" > /dev/null 2>&1; then
                  if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
                    echo "carplay-v${CP_VERSION} exists; forced"
                    echo "release=true" >> $GITHUB_OUTPUT
                  else
                    echo "carplay-v${CP_VERSION} is already released — building, not releasing"
                    echo "release=false" >> $GITHUB_OUTPUT
                  fi
                else
                  echo "carplay-v${CP_VERSION} is new"
                  echo "release=true" >> $GITHUB_OUTPUT
                fi

            - name: Install build dependencies
              run: brew install ldid make dpkg

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build, rootless
              run: |
                cd main
                chmod +x build.sh
                ./build.sh carplay rootless
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Setup roothide Theos
              uses: actions/checkout@v4
              with:
                repository: roothide/theos
                ref: master
                path: ${{ github.workspace }}/theos-roothide
                submodules: recursive

            - name: Share the SDK with roothide Theos
              run: |
                mkdir -p "${{ github.workspace }}/theos-roothide/sdks"
                cp -R "${{ github.workspace }}/theos/sdks/." "${{ github.workspace }}/theos-roothide/sdks/"
                ls "${{ github.workspace }}/theos-roothide/sdks"

            - name: Build, roothide
              run: |
                cd main
                ./build.sh carplay roothide
              env:
                THEOS: ${{ github.workspace }}/theos-roothide

            - name: Check both flavours were produced
              run: |
                cd main
                ls -la tweaks/carplay/packages/
                COUNT=$(ls tweaks/carplay/packages/*.deb 2>/dev/null | wc -l | tr -d ' ')
                if [ "$COUNT" != "2" ]; then
                  echo "::error::expected a rootless and a roothide .deb, found $COUNT"
                  exit 1
                fi
                echo "ok  two packages"

                for DEB in tweaks/carplay/packages/*.deb; do
                  echo ""
                  echo "================================================================"
                  echo "$DEB"
                  echo "================================================================"
                  dpkg-deb -f "$DEB"
                  echo "--- paths"
                  dpkg-deb -c "$DEB" | awk '{print $NF}' | sort
                done

            - name: Check the package holds both dylibs
              # A merged tree that quietly lost a dylib installs perfectly and does
              # nothing -- the same failure buildsuite.yml's own check guards against.
              # Two dylibs since v0.3.0: AlbrhiCP (SpringBoard + Camera) and
              # AlbrhiCPApp (every app that links UIKit, filtered in its own plist).
              run: |
                cd main
                for DEB in tweaks/carplay/packages/*.deb; do
                  echo "Inspecting $DEB"
                  dpkg-deb -c "$DEB" > /tmp/contents.txt
                  cat /tmp/contents.txt
                  for EXPECTED in \
                      DynamicLibraries/AlbrhiCP.dylib DynamicLibraries/AlbrhiCP.plist \
                      DynamicLibraries/AlbrhiCPApp.dylib DynamicLibraries/AlbrhiCPApp.plist
                  do
                    if ! grep -q "$EXPECTED" /tmp/contents.txt; then
                      echo "::error::$EXPECTED is missing from $DEB"
                      exit 1
                    fi
                    echo "ok  $EXPECTED in $(basename "$DEB")"
                  done
                done

            - name: Rename the debs to their published names
              # Debian convention -- package_version_architecture.deb -- so the two
              # flavours can never collide on one filename the way a converted
              # package's original name has collided before.
              run: |
                cd main/tweaks/carplay/packages
                for DEB in *.deb; do
                  PKG=$(dpkg-deb -f "$DEB" Package)
                  VER=$(dpkg-deb -f "$DEB" Version)
                  ARCH=$(dpkg-deb -f "$DEB" Architecture)
                  TARGET="${PKG}_${VER}_${ARCH}.deb"
                  if [ "$DEB" != "$TARGET" ]; then
                    mv -f "$DEB" "$TARGET"
                    echo "  ${DEB} -> ${TARGET}"
                  fi
                done
                ls -la

            - name: Upload both debs
              uses: actions/upload-artifact@v4
              with:
                name: AlbrhiCarPlay-${{ env.CP_VERSION }}
                path: main/tweaks/carplay/packages/*.deb
                if-no-files-found: error

            - name: Extract changelog for this version
              if: steps.gate.outputs.release == 'true'
              run: |
                cd main
                python3 tools/release-notes.py tweaks/carplay/CHANGELOG.md tweaks/carplay/control > /tmp/notes.md
                echo '--- release notes'
                cat /tmp/notes.md

            - name: Publish release
              if: steps.gate.outputs.release == 'true'
              uses: softprops/action-gh-release@v2
              with:
                name: Albrhi CarPlay ${{ env.CP_VERSION }}
                tag_name: carplay-v${{ env.CP_VERSION }}
                body_path: /tmp/notes.md
                files: main/tweaks/carplay/packages/*.deb
                fail_on_unmatched_files: true

            - name: Gather every published package
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/carplay-v')
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                # Built from what is published, not from this run's compile, for the same
                # reason buildsuite.yml does it: make-repo.sh wipes debs/ and rebuilds it,
                # so an index built from one workflow's output alone would erase the other
                # publisher's packages from the source.
                chmod +x main/tools/fetch-published-debs.sh
                ./main/tools/fetch-published-debs.sh published "${{ github.repository }}" 3 "main/tweaks/carplay/packages" carplay

            - name: Publish APT repo to GitHub Pages
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/carplay-v')
              env:
                GH_TOKEN: ${{ github.token }}
              run: |
                set -x
                REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
                REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

                rm -rf pages
                mkdir pages
                cd pages
                git init -q
                git remote add origin "$REMOTE"

                if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
                  echo "gh-pages exists — fetching it."
                  git fetch -q --depth 1 origin gh-pages
                  git checkout -q -b gh-pages FETCH_HEAD
                else
                  echo "gh-pages does not exist — starting a fresh branch."
                  git checkout -q -b gh-pages
                fi

                cd ..

                chmod +x main/tools/make-repo.sh
                ./main/tools/make-repo.sh published pages "$REPO_URL"

                cp main/tools/repo-index.html pages/index.html

                mkdir -p pages/deb-edit
                cp main/tools/deb-edit.html pages/deb-edit/index.html

                mkdir -p pages/inject
                cp main/tools/ipa-inject.html pages/inject/index.html

                # Regenerated every run so the version and changelog shown always match
                # what was actually built. From the tweak's own directory, because the
                # generator reads CHANGELOG.md relative to its working directory.
                PAGES_DIR="$(pwd)/pages"
                ( cd main/tweaks/carplay && python3 ../../tools/make-depiction.py "$PAGES_DIR" "$CP_VERSION" "$REPO_URL" carplay )

                ls -la pages/depictions

                # Regenerated every run too; buildsuite.yml already does this for the same
                # source icon, so this only needs to not clobber it with different bytes --
                # make-logo.py is deterministic from the same tools/logo.png override (or
                # its absence), so the two runs always agree.
                python3 main/tools/make-logo.py pages/CydiaIcon.png 512

                touch pages/.nojekyll

                cd pages
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add -A

                if git diff --cached --quiet; then
                  echo "Repo index unchanged — nothing to push."
                  exit 0
                fi

                git commit -q -m "Repo: Albrhi CarPlay ${CP_VERSION}"
                git push -q origin gh-pages

                echo "Index committed to gh-pages; the deploy steps below publish it."

            - name: Serve the source from the branch
              if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/carplay-v')
              env:
                GH_TOKEN: ${{ github.token }}
              # Same reasoning as buildsuite.yml's identical step: deploy-pages queued
              # indefinitely on this repository and was removed for it. An APT source
              # does not need it -- gh-pages is pushed above and already holds the
              # finished index; this only makes the branch-serving arrangement explicit
              # and requests a build rather than depending on a push trigger that has
              # stopped firing before without warning.
              run: |
                echo "Pointing Pages at the gh-pages branch"
                gh api -X PUT "repos/${{ github.repository }}" --field has_pages=true --silent 2>/dev/null || true

                if gh api -X PUT "repos/${{ github.repository }}/pages" --field 'build_type=legacy' --field 'source[branch]=gh-pages' --field 'source[path]=/' --silent 2>/dev/null; then
                  echo "Pages now serves gh-pages"
                else
                  echo "::warning::could not set the Pages source; continuing"
                fi

                gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent && echo "build requested" || echo "::warning::could not request a build; the push may still start one"

            - name: Check the source actually serves this version
              if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/carplay-v'))
              run: |
                BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/Packages"
                echo "Asking $BASE for com.albrhi.carplay ${CP_VERSION}"

                for ATTEMPT in $(seq 1 6); do
                  BODY=$(curl -fsSL "${BASE}?t=$(date +%s)-${ATTEMPT}" 2>/dev/null || true)

                  if printf '%s' "$BODY" | grep -A5 '^Package: com.albrhi.carplay$' | grep -q "^Version: ${CP_VERSION}$"; then
                    echo "ok  the source is serving ${CP_VERSION}"
                    exit 0
                  fi

                  SERVING=$(printf '%s' "$BODY" | grep -A5 '^Package: com.albrhi.carplay$' | grep '^Version:' | sort -V | tail -n1)
                  echo "attempt ${ATTEMPT}: ${SERVING:-nothing for com.albrhi.carplay yet}"
                  sleep 20
                done

                echo "Serving: ${SERVING:-nothing for com.albrhi.carplay}"
                echo ""

                if [ -n "$SERVING" ]; then
                  echo "::notice::the source is serving ${SERVING#Version: }; ${CP_VERSION} follows when Pages builds"
                  echo "The release is published and the branch holds the right index."
                  echo "Nothing here needs doing."
                  exit 0
                fi

                echo "::error::the source is serving no com.albrhi.carplay at all"
                echo ""
                echo "The release is published and gh-pages holds the finished index, so"
                echo "the branch is right and the site is not being built from it."
                echo ""
                echo "Check the one setting this side cannot read:"
                echo ""
                echo "  Settings -> Pages -> Build and deployment -> Source"
                echo "      Deploy from a branch"
                echo "      Branch: gh-pages    Folder: / (root)"
                echo ""
                echo "If it says GitHub Actions instead, branch pushes are never served"
                echo "and the site stays frozen at the last branch build -- which looks"
                echo "exactly like this."
                exit 1
