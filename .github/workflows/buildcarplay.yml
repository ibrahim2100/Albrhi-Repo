name: Build Albrhi CarPlay

#
# **Manual only. This workflow no longer publishes anything.**
#
# CarPlay is withheld from the source while its app-bridging mechanism is still
# unconfirmed on a device. 0.4.1 shipped three fixes that a real iOS 16.1 report
# said were missing, and none of the three has been observed working; 0.4.0 and
# 0.3.0 each looked finished and were not. Publishing a package on that footing
# offers an update to people whose only report so far is that it does not work.
#
# So the withholding is deliberate and reversible, and it has two halves, because
# stopping the publisher alone would leave the already-published carplay-v* releases
# in the index forever -- tools/fetch-published-debs.sh builds the index from what is
# *published*, not from any one run's output, which is exactly what makes it survive
# two publishers and exactly what makes silence here insufficient. That script now
# names com.albrhi.carplay as withheld and skips it on the way in. Both halves have to
# be undone together to publish again; the note there says so too.
#
# This is kept, rather than deleted, for the same reason the other five per-tweak
# workflows are: building one tweak on its own is still the fastest way to find out
# whether it compiles. It produces two packages and stops.
#
# **To publish CarPlay again**, in one commit:
#   1. restore the `push:` trigger, the release gate, the release step, the gather,
#      the Pages steps and the `albrhi-pages` concurrency group -- git history for
#      this file holds all of them, as of the commit that removed them;
#   2. remove com.albrhi.carplay from WITHHELD_PACKAGES in
#      tools/fetch-published-debs.sh.
# Doing only the first republishes nothing, because the gather would still drop the
# package this workflow had just released, and the run's own guard would then fail it
# for publishing a source older than its release -- correctly.
#

on:
    workflow_dispatch:

jobs:
    build:
        name: Build both flavours
        runs-on: macos-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Source checks
              # Before Theos, so a typo fails in seconds rather than after a
              # five-minute compile.
              run: |
                cd main
                python3 tools/check.py

            - name: Read the version
              run: |
                V=$(awk -F': *' '/^Version:/ {print $2; exit}' main/tweaks/carplay/control)
                echo "CP_VERSION=$V" >> $GITHUB_ENV
                echo "Building Albrhi CarPlay $V"

            - name: Install build dependencies
              run: brew install ldid make dpkg

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Build, rootless
              run: |
                cd main
                chmod +x build.sh
                ./build.sh carplay rootless
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Setup roothide Theos
              uses: actions/checkout@v4
              with:
                repository: roothide/theos
                ref: master
                path: ${{ github.workspace }}/theos-roothide
                submodules: recursive

            - name: Share the SDK with roothide Theos
              run: |
                mkdir -p "${{ github.workspace }}/theos-roothide/sdks"
                cp -R "${{ github.workspace }}/theos/sdks/." "${{ github.workspace }}/theos-roothide/sdks/"
                ls "${{ github.workspace }}/theos-roothide/sdks"

            - name: Build, roothide
              run: |
                cd main
                ./build.sh carplay roothide
              env:
                THEOS: ${{ github.workspace }}/theos-roothide

            - name: Check both flavours were produced
              run: |
                cd main
                ls -la tweaks/carplay/packages/
                COUNT=$(ls tweaks/carplay/packages/*.deb 2>/dev/null | wc -l | tr -d ' ')
                if [ "$COUNT" != "2" ]; then
                  echo "::error::expected a rootless and a roothide .deb, found $COUNT"
                  exit 1
                fi
                echo "ok  two packages"

                for DEB in tweaks/carplay/packages/*.deb; do
                  echo ""
                  echo "================================================================"
                  echo "$DEB"
                  echo "================================================================"
                  dpkg-deb -f "$DEB"
                  echo "--- paths"
                  dpkg-deb -c "$DEB" | awk '{print $NF}' | sort
                done

            - name: Check the package holds both dylibs
              # A merged tree that quietly lost a dylib installs perfectly and does
              # nothing -- the same failure buildsuite.yml's own check guards against.
              # Two dylibs since v0.3.0: AlbrhiCP (SpringBoard + Camera) and
              # AlbrhiCPApp (every app that links UIKit, filtered in its own plist).
              run: |
                cd main
                for DEB in tweaks/carplay/packages/*.deb; do
                  echo "Inspecting $DEB"
                  dpkg-deb -c "$DEB" > /tmp/contents.txt
                  cat /tmp/contents.txt
                  for EXPECTED in \
                      DynamicLibraries/AlbrhiCP.dylib DynamicLibraries/AlbrhiCP.plist \
                      DynamicLibraries/AlbrhiCPApp.dylib DynamicLibraries/AlbrhiCPApp.plist
                  do
                    if ! grep -q "$EXPECTED" /tmp/contents.txt; then
                      echo "::error::$EXPECTED is missing from $DEB"
                      exit 1
                    fi
                    echo "ok  $EXPECTED in $(basename "$DEB")"
                  done
                done

            - name: Rename the debs to their published names
              # Debian convention -- package_version_architecture.deb -- so the two
              # flavours can never collide on one filename the way a converted
              # package's original name has collided before. Kept even though nothing
              # is published from here: the artifact is what gets installed by hand
              # while the source withholds the package, and the same two flavours are
              # as easy to confuse in a download as they are in Sileo.
              run: |
                cd main/tweaks/carplay/packages
                for DEB in *.deb; do
                  PKG=$(dpkg-deb -f "$DEB" Package)
                  VER=$(dpkg-deb -f "$DEB" Version)
                  ARCH=$(dpkg-deb -f "$DEB" Architecture)
                  TARGET="${PKG}_${VER}_${ARCH}.deb"
                  if [ "$DEB" != "$TARGET" ]; then
                    mv -f "$DEB" "$TARGET"
                    echo "  ${DEB} -> ${TARGET}"
                  fi
                done
                ls -la

            - name: Upload both debs
              uses: actions/upload-artifact@v4
              with:
                name: AlbrhiCarPlay-${{ env.CP_VERSION }}
                path: main/tweaks/carplay/packages/*.deb
                if-no-files-found: error
